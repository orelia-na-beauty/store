<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مجموعة العناية بالبشرة والجسم | 199 درهم</title>

  <meta name="description" content="مجموعة العناية والجمال بروح صحراوية أصيلة. ماسك القنبلة الصحراوية، النيلة الصحراوية، مخمرية، كريم كعب الغزال، لوشن ورشوش صحراوي. 199 درهم والتوصيل مجاني لجميع المدن المغربية.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      line-height: 1.8;
    }

    .container {
      width: 92%;
      max-width: 1050px;
      margin: auto;
    }

    /* HEADER */
    header {
      padding: 18px 0;
      background: #080808;
      border-bottom: 1px solid #b89545;
      text-align: center;
    }

    .brand {
      color: #d9b65a;
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .small-text {
      color: #ddd;
      font-size: 13px;
    }

    /* HERO */
    .hero {
      padding: 35px 0 45px;
      text-align: center;
      background:
        radial-gradient(circle at top, #3a2b10 0%, #111 35%, #080808 75%);
    }

    .badge {
      display: inline-block;
      background: #d9b65a;
      color: #111;
      padding: 7px 18px;
      border-radius: 30px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    h1 {
      color: #e5c76a;
      font-size: 34px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .hero-subtitle {
      color: #eee;
      font-size: 17px;
      max-width: 700px;
      margin: auto;
    }

    /* PRODUCT IMAGE */
    .product-image {
      margin: 28px auto;
      max-width: 650px;
      background: #fff;
      padding: 8px;
      border-radius: 18px;
      border: 2px solid #c9a94e;
      box-shadow: 0 0 35px rgba(211, 175, 75, 0.25);
    }

    .product-image img {
      width: 100%;
      display: block;
      border-radius: 12px;
    }

    /* PRICE */
    .price-box {
      margin: 20px auto;
      max-width: 430px;
      padding: 20px;
      border: 1px solid #c9a94e;
      border-radius: 18px;
      background: linear-gradient(145deg, #171717, #0d0d0d);
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
      font-size: 17px;
    }

    .price {
      color: #f0ce67;
      font-size: 42px;
      font-weight: bold;
    }

    .delivery {
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }

    /* BUTTON */
    .order-btn {
      display: inline-block;
      margin-top: 20px;
      background: linear-gradient(135deg, #e4c15e, #a87c20);
      color: #111;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      padding: 14px 35px;
      border-radius: 40px;
      box-shadow: 0 8px 25px rgba(214, 174, 72, 0.25);
      transition: 0.2s;
    }

    .order-btn:hover {
      transform: scale(1.03);
    }

    /* SECTION */
    section {
      padding: 45px 0;
    }

    .section-title {
      text-align: center;
      color: #e5c76a;
      font-size: 27px;
      margin-bottom: 25px;
    }

    .intro {
      text-align: center;
      color: #ddd;
      max-width: 750px;
      margin: auto;
      font-size: 17px;
    }

    /* PRODUCTS */
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .card {
      background: linear-gradient(145deg, #171717, #0e0e0e);
      border: 1px solid #695523;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    .icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .card h3 {
      color: #e4c15e;
      font-size: 18px;
      margin-bottom: 7px;
    }

    .card p {
      color: #ccc;
      font-size: 14px;
    }

    /* BENEFITS */
    .benefits {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .benefit {
      text-align: center;
      background: #111;
      border: 1px solid #4d401f;
      padding: 18px 10px;
      border-radius: 14px;
    }

    .benefit span {
      font-size: 30px;
      display: block;
      margin-bottom: 5px;
    }

    .benefit strong {
      color: #e4c15e;
      font-size: 15px;
    }

    /* OFFER */
    .offer {
      text-align: center;
      background:
        radial-gradient(circle, #34260d 0%, #111 65%);
      border-top: 1px solid #8d7130;
      border-bottom: 1px solid #8d7130;

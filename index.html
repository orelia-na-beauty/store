<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORÉLIA NA BEAUTY</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f8f5ef;
color:#2d241d;
}

header{
background:#123c2f;
color:#d8b36a;
padding:12px 15px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 3px 15px #0003;
}

.logo-img{
width:90px;
height:90px;
object-fit:cover;
border-radius:50%;
border:3px solid #d8b36a;
background:white;
}

nav{
margin-top:12px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-size:13px;
}

.cart-button{
position:fixed;
left:15px;
bottom:20px;
z-index:2000;
background:#d8b36a;
color:#123c2f;
width:58px;
height:58px;
border-radius:50%;
border:none;
font-size:25px;
box-shadow:0 4px 15px #0004;
}

.cart-count{
position:absolute;
top:-5px;
right:-5px;
background:#b32929;
color:white;
width:23px;
height:23px;
border-radius:50%;
font-size:12px;
display:flex;
align-items:center;
justify-content:center;
}

.hero{
min-height:430px;
padding:60px 20px;
text-align:center;
background:linear-gradient(#123c2fe6,#123c2fb8),
linear-gradient(135deg,#d9c49d,#fffaf3);
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.hero h1{
font-family:Georgia,serif;
font-size:38px;
color:#e2c47d;
margin-bottom:18px;
}

.hero p{
max-width:650px;
line-height:2;
font-size:16px;
margin-bottom:25px;
}

.btn{
display:inline-block;
background:#d8b36a;
color:#123c2f;
padding:13px 28px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
border:none;
}

section{
padding:45px 18px;
max-width:1100px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:30px;
}

.title h2{
color:#174b3a;
font-size:28px;
margin-bottom:8px;
}

.title p{
color:#777;
}

.categories{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.category{
background:white;
padding:22px 10px;
text-align:center;
border-radius:15px;
box-shadow:0 3px 15px #00000012;
border-bottom:3px solid #d8b36a;
}

.category .icon{
font-size:34px;
margin-bottom:8px;
}

.category h3{
font-size:15px;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.product{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 3px 15px #00000012;
padding-bottom:15px;
}

.product-img{
width:100%;
height:190px;
object-fit:cover;
display:block;
background:#eee;
}

.product h3{
padding:13px 12px 5px;
font-size:16px;
color:#174b3a;
}

.product p{
padding:0 12px;
color:#777;
font-size:13px;
line-height:1.6;
min-height:42px;
}

.price{
display:block;
padding:10px 12px;
color:#a47731;
font-weight:bold;
font-size:18px;
}

.add-cart{
margin:0 12px;
width:calc(100% - 24px);
background:#174b3a;
color:white;
border:none;
padding:11px;
border-radius:25px;
font-weight:bold;
cursor:pointer;
}

.add-cart:active{
transform:scale(.97);
}

.about{
background:#123c2f;
color:white;
max-width:none;
text-align:center;
}

.about h2{
color:#d8b36a;
margin-bottom:15px;
}

.about p{
max-width:700px;
margin:auto;
line-height:2;
}

.contact{
text-align:center;
}

footer{
background:#0c2921;
color:#aaa;
text-align:center;
padding:25px 15px;
font-size:13px;
}

/* السلة */

.cart-overlay{
position:fixed;
inset:0;
background:#0008;
z-index:3000;
display:none;
}

.cart{
position:absolute;
left:0;
top:0;
width:92%;
max-width:430px;
height:100%;
background:white;
padding:20px;
overflow-y:auto;
}

.cart h2{
color:#174b3a;
margin-bottom:20px;
}

.close-cart{
position:absolute;
left:15px;
top:15px;
border:none;
background:none;
font-size:25px;
}

.cart-item{
display:flex;
align-items:center;
gap:8px;
padding:12px 0;
border-bottom:1px solid #eee;
}

.cart-item-info{
flex:1;
}

.cart-item-info h4{
font-size:14px;
margin-bottom:5px;
}

.cart-item-info span{
color:#a47731;
font-size:13px;
}

.qty{
display:flex;
align-items:center;
gap:7px;
}

.qty button{
width:27px;
height:27px;
border:none;
border-radius:50%;
background:#174b3a;
color:white;
}

.remove{
border:none;
background:none;
color:#b32929;
font-size:18px;
}

.cart-total{
margin-top:20px;
padding:15px;
background:#f5efe4;
border-radius:12px;
font-size:19px;
font-weight:bold;
color:#174b3a;
}

.whatsapp{
display:block;
width:100%;
margin-top:15px;
padding:14px;
background:#25D366;
color:white;
text-align:center;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}

.clear{
width:100%;
margin-top:10px;
padding:10px;
border:1px solid #b32929;
background:white;
color:#b32929;
border-radius:25px;
}

.empty{
text-align:center;
color:#777;
padding:40px 10px;
}

@media(min-width:700px){

.categories{
grid-template-columns:repeat(3,1fr);
}

.products{
grid-template-columns:repeat(4,1fr);
}

.hero h1{
font-size:52px;
}

}
</style>
</head>

<body>

<header>

<img src="logo.png" class="logo-img" alt="ORÉLIA NA BEAUTY">

<nav>
<a href="#home">الرئيسية</a>
<a href="#categories">الأقسام</a>
<a href="#weight">زيادة الوزن</a>
<a href="#hair">الع
